name: Competitor research crawl

on:
  schedule:
    # 05:00 UTC ≈ 08:00 Doha time — before business hours. Adjust as needed.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r research_crawler/requirements.txt

      - run: python -m research_crawler.crawler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKEND_INGEST_URL: ${{ secrets.BACKEND_INGEST_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
